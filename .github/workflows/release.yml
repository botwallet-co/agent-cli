name: Release

on:
  push:
    tags:
      - 'v*'
  # Publishes an already released tag to npm again, without GoReleaser
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish to npm, e.g. v0.1.0-beta.13
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  # Publishes @botwallet/agent-cli via npm trusted publishing (OIDC) — no npm token.
  # Trusted publisher is configured on npmjs.com → @botwallet/agent-cli → Settings
  # (repo botwallet-co/agent-cli, workflow release.yml).
  npm-publish:
    needs: goreleaser
    # Also runs when goreleaser is skipped (workflow_dispatch)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Get version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update package version
        working-directory: npm
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        run: |
          if npm view "@botwallet/agent-cli@${{ steps.version.outputs.VERSION }}" version >/dev/null 2>&1; then
            echo "already published — skipping"
          else
            # npm needs an explicit dist-tag for a prerelease. Every release so far is
            # a beta and `npm i -g @botwallet/agent-cli` should install the newest one.
            npm publish --access public --tag latest
          fi
